<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TrendShop — TikTok Trend Intelligence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --bg-base:#0b0d13; --bg-surface:#12151f; --bg-elevated:#191d2a; --bg-hover:#1e2230;
        --border:rgba(255,255,255,0.06); --border-md:rgba(255,255,255,0.10); --border-accent:rgba(0,229,176,0.25);
        --text-primary:#e4eaf4; --text-secondary:#7d8fa8; --text-tertiary:#3d4a5c;
        --accent:#00e5b0; --accent-dim:rgba(0,229,176,0.08); --accent-glow:rgba(0,229,176,0.15);
        --red:#ff4d6a; --red-dim:rgba(255,77,106,0.1);
        --orange:#ffaa00; --orange-dim:rgba(255,170,0,0.1);
        --green:#00e5b0; --green-dim:rgba(0,229,176,0.1);
        --blue:#4da6ff; --blue-dim:rgba(77,166,255,0.1);
        --font-display:'Syne',sans-serif; --font-mono:'JetBrains Mono',monospace;
        --font-body:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
        --radius-sm:6px; --radius-md:10px; --radius-lg:14px; --sidebar-w:220px;
      }
      html,body { height:100%; }
      body { background:var(--bg-base); color:var(--text-primary); font-family:var(--font-body); font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased; }
      #root { height:100%; }
      ::-webkit-scrollbar { width:4px; height:4px; }
      ::-webkit-scrollbar-track { background:transparent; }
      ::-webkit-scrollbar-thumb { background:var(--border-md); border-radius:4px; }
      ::selection { background:var(--accent-dim); color:var(--accent); }
      a { color:var(--accent); text-decoration:none; }
      a:hover { opacity:0.8; }
      input { font-family:var(--font-body); background:var(--bg-elevated); border:1px solid var(--border); color:var(--text-primary); border-radius:var(--radius-sm); padding:8px 12px; font-size:13px; width:100%; outline:none; transition:border 0.15s; }
      input:focus { border-color:var(--border-accent); }
      input::placeholder { color:var(--text-tertiary); }
      input[type="password"] { font-family:var(--font-mono); letter-spacing:2px; }
      input[type="password"]::placeholder { font-family:var(--font-body); letter-spacing:normal; }
      button { font-family:var(--font-body); cursor:pointer; transition:all 0.15s; border:none; outline:none; }
      button:active { transform:scale(0.97); }
      button:disabled { opacity:0.4; cursor:not-allowed; transform:none !important; }
      @keyframes pulse  {0%,100%{opacity:.15}50%{opacity:.7}}
      @keyframes fadeIn {from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
      @keyframes blink  {0%,80%,100%{opacity:.15}40%{opacity:.8}}
      @keyframes glow   {0%,100%{opacity:.6}50%{opacity:1}}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
