<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TrendShop — TikTok Trend Automation</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #f9f9f8;
        color: #1a1a1a;
        min-height: 100vh;
        padding: 24px 16px;
      }
      #root { max-width: 960px; margin: 0 auto; }

      /* CSS variables to match Claude.ai design system */
      :root {
        --color-background-primary: #ffffff;
        --color-background-secondary: #f4f3f0;
        --color-background-tertiary: #f9f9f8;
        --color-background-success: #eaf3de;
        --color-background-warning: #faeeda;
        --color-background-danger: #fcebeb;
        --color-background-info: #e6f1fb;

        --color-text-primary: #1a1a1a;
        --color-text-secondary: #5f5e5a;
        --color-text-tertiary: #888780;
        --color-text-success: #3b6d11;
        --color-text-warning: #854f0b;
        --color-text-danger: #a32d2d;
        --color-text-info: #185fa5;

        --color-border-tertiary: rgba(0,0,0,0.1);
        --color-border-secondary: rgba(0,0,0,0.2);
        --color-border-primary: rgba(0,0,0,0.3);
        --color-border-success: #639922;
        --color-border-info: #378add;
        --color-border-warning: #ba7517;
        --color-border-danger: #e24b4a;

        --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        --font-mono: 'SF Mono', 'Fira Code', monospace;
        --border-radius-md: 8px;
        --border-radius-lg: 12px;
        --border-radius-xl: 16px;
      }

      input, button, select {
        font-family: var(--font-sans);
      }

      input[type="password"], input[type="text"] {
        outline: none;
        transition: border 0.15s;
      }
      input[type="password"]:focus, input[type="text"]:focus {
        border-color: rgba(0,0,0,0.4) !important;
      }

      button:hover { opacity: 0.85; }
      button:active { transform: scale(0.98); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
